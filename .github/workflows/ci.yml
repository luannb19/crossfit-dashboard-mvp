name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insightflow
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightflow?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Show npm versions
        run: |
          node -v
          npm -v

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci || (echo "npm ci failed, falling back to npm install"; rm -f package-lock.json && npm install)
          else
            npm install
          fi

      - name: Generate Prisma client
        run: npx prisma generate
       

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Prisma migrate (only if provider = postgresql)
        run: |
          if grep -q 'provider *= *"postgresql"' prisma/schema.prisma; then
            npx prisma migrate deploy
          else
            echo "Skipping migrate (schema provider != postgresql)"
          fi

        

      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - name: Backend tests (coverage)
        run: npm run test:coverage

      - name: Publicar artefato de coverage (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: backend/coverage/**
          if-no-files-found: error
          retention-days: 7


  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gestor-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/gestor-dashboard/package-lock.json

      - name: Show npm versions
        run: |
          node -v
          npm -v

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci || (echo "npm ci failed, falling back to npm install"; rm -f package-lock.json && npm install)
          else
            npm install
          fi

      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run build --if-present
