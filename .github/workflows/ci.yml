name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Show npm versions
        run: |
          node -v
          npm -v

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci || (echo "npm ci failed, falling back to npm install"; rm -f package-lock.json && npm install)
          else
            npm install
          fi

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run build --if-present

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gestor-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/gestor-dashboard/package-lock.json

      - name: Show npm versions
        run: |
          node -v
          npm -v

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci || (echo "npm ci failed, falling back to npm install"; rm -f package-lock.json && npm install)
          else
            npm install
          fi

      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run build --if-present
