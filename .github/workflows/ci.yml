name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # usa npm ci se houver lockfile, senão npm install
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # gera prisma sem precisar de Postgres
      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      # só roda se typescript estiver instalado
      - name: Typecheck (if TS present)
        run: |
          if [ -f node_modules/.bin/tsc ]; then
            npm run typecheck
          else
            echo "Skipping typecheck (TypeScript not installed)"
          fi

      # só roda se eslint estiver instalado
      - name: Lint (if ESLint present)
        run: |
          if [ -f node_modules/.bin/eslint ]; then
            npm run lint
          else
            echo "Skipping lint (ESLint not installed)"
          fi

      - name: Build (if script present)
        run: npm run build --if-present

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gestor-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/gestor-dashboard/package-lock.json

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck (if TS present)
        run: |
          if [ -f node_modules/.bin/tsc ]; then
            npm run typecheck
          else
            echo "Skipping typecheck (TypeScript not installed)"
          fi

      - name: Lint (if ESLint present)
        run: |
          if [ -f node_modules/.bin/eslint ]; then
            npm run lint
          else
            echo "Skipping lint (ESLint not installed)"
          fi

      - name: Build (if script present)
        run: npm run build --if-present
