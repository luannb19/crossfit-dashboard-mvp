version: "3.9"
services:
  db:
    image: postgres:16
    container_name: insightflow-db
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insightflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insightflow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
